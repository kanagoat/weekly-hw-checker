<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --teal: #1f6f6b;
    --teal-dark: #14504d;
    --charcoal: #2b2f33;
    --bg: #f7f8f8;
    --card: #ffffff;
    --border: #dfe3e3;
    --correct: #1f8a52;
    --incorrect: #b3392c;
    --muted: #6b7280;
    --gold: #b8860b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--charcoal);
  }
  header {
    background: var(--charcoal);
    color: #fff;
    padding: 28px 20px;
    text-align: center;
  }
  header h1 {
    font-family: Cambria, Georgia, serif;
    margin: 0 0 6px 0;
    font-size: 1.6em;
  }
  header p { margin: 0; opacity: 0.8; font-size: 0.95em; }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px 16px;
  }

  #student-name-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  #student-name-block label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
  }
  #student-name-block input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1em;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .question-card .q-title {
    font-family: Cambria, Georgia, serif;
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 1.05em;
  }
  .question-card input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1em;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .mc-options label {
    display: block;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .mc-options input { margin-right: 8px; }

  .feedback-line {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.95em;
    display: none;
  }
  .feedback-line.correct {
    display: block;
    background: #e6f4ea;
    color: var(--correct);
  }
  .feedback-line.incorrect {
    display: block;
    background: #fbe9e7;
    color: var(--incorrect);
  }
  .feedback-line .locked-note {
    display: block;
    margin-top: 4px;
    font-size: 0.85em;
    font-style: italic;
    color: var(--muted);
  }

  #submit-btn {
    width: 100%;
    padding: 14px;
    font-size: 1.05em;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #submit-btn:hover { background: var(--teal-dark); }
  #submit-btn:disabled { opacity: 0.6; cursor: default; }

  #result-block {
    display: none;
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    color: #fff;
  }
  #result-block.pass { background: var(--correct); }
  #result-block.fail { background: var(--incorrect); }
  #result-block .big-percent {
    font-family: Cambria, Georgia, serif;
    font-size: 2.4em;
    font-weight: bold;
  }
  #result-block .attempt-note {
    margin-top: 8px;
    font-size: 0.9em;
    opacity: 0.9;
  }
  #result-block .streak-badge {
    display: none;
    margin: 10px auto 0 auto;
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    font-weight: bold;
    max-width: max-content;
  }

  #solutions-block {
    display: none;
    margin-top: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  #solutions-block h2 {
    font-family: Cambria, Georgia, serif;
    font-size: 1.15em;
    margin: 0 0 12px 0;
  }
  .solution-line {
    padding: 10px 0;
    border-top: 1px solid var(--border);
    font-size: 0.95em;
  }
  .solution-line:first-of-type { border-top: none; }
  .solution-line .solution-q { font-weight: bold; color: var(--teal-dark); }

  #error-block {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    background: #fbe9e7;
    color: var(--incorrect);
    border-radius: 8px;
  }
  #cooldown-block {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    background: #fff4e0;
    color: var(--gold);
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
  }
  #loading-block {
    text-align: center;
    padding: 30px 14px;
    color: var(--muted);
  }

  #confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
  <h1 id="page-title">Homework</h1>
  <p id="page-subtitle">Fill in your answers and press "Submit" — you'll get your result right away</p>
</header>

<main>
  <div id="student-name-block">
    <label for="student-name">Full name</label>
    <input type="text" id="student-name" placeholder="e.g. Alex Morgan">
  </div>

  <div id="loading-block">Loading this week's questions…</div>
  <div id="questions-container"></div>

  <button id="submit-btn" style="display:none;">Submit for checking</button>

  <div id="error-block"></div>
  <div id="cooldown-block"></div>

  <div id="result-block">
    <div class="big-percent" id="result-percent"></div>
    <div id="result-text"></div>
    <div class="attempt-note" id="result-attempt-note"></div>
    <div class="streak-badge" id="streak-badge"></div>
  </div>

  <div id="solutions-block">
    <h2>📘 Full worked solutions</h2>
    <div id="solutions-container"></div>
  </div>
</main>

<script>
/* =========================================================================
   This page is the same file for every week — nothing here needs editing.
   Which week it shows comes from the URL's "week" parameter, e.g.:
     weekly-hw-template.html?week=week-01
   The question text, type, and (for multiple choice) the options themselves
   are fetched from the AnswerKey sheet at load time. Correct answers, hints,
   and solutions are never sent to the browser until they're supposed to be.
   ========================================================================= */

const CONFIG = {
  // Apps Script web app URL (Deploy → New deployment → Web app)
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbz7CnzOs39aO8jTRa7C7Zdp3thOrDvQEDNV88QE0bV4obvLcWDFYp6AuIFd4sqd4Rs/exec"
};

const WEEK_ID = new URLSearchParams(window.location.search).get('week');

// Populated once the week's questions have loaded (see loadWeek() below).
let QUESTIONS = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ]
    });
  }
}

/**
 * Builds the question cards for one week. `choices` (mc only) is a plain
 * array of option texts fetched from the server — the option a student
 * picks is graded by matching its text against AnswerKey's CorrectAnswer,
 * the same way a "text" answer is, so there's no separate a/b/c code to
 * keep in sync.
 */
function buildQuestionsUI(questions) {
  const container = document.getElementById('questions-container');

  questions.forEach(function (q) {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + q.id;

    const title = document.createElement('div');
    title.className = 'q-title';
    title.textContent = q.title;
    card.appendChild(title);

    if (q.type === 'mc') {
      const optionsWrap = document.createElement('div');
      optionsWrap.className = 'mc-options';
      shuffle(q.choices || []).forEach(function (choiceText) {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = q.id;
        input.value = choiceText;
        label.appendChild(input);
        const text = document.createElement('span');
        text.textContent = choiceText;
        label.appendChild(text);
        optionsWrap.appendChild(label);
      });
      card.appendChild(optionsWrap);
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'input-' + q.id;
      input.placeholder = q.type === 'numeric' ? 'Enter a number' : 'Enter your answer';
      card.appendChild(input);
    }

    const feedbackLine = document.createElement('div');
    feedbackLine.className = 'feedback-line';
    feedbackLine.id = 'feedback-' + q.id;
    card.appendChild(feedbackLine);

    container.appendChild(card);
  });
}

/** Fetches this week's question list from the server and renders the page. */
function loadWeek() {
  const loadingBlock = document.getElementById('loading-block');

  if (!WEEK_ID) {
    loadingBlock.style.display = 'none';
    showError('No week specified. Open this page with ?week=week-01 (matching a WeekID in your AnswerKey sheet) added to the URL.');
    return;
  }

  fetch(CONFIG.SCRIPT_URL + '?week=' + encodeURIComponent(WEEK_ID))
    .then(function (res) { return res.json(); })
    .then(function (data) {
      loadingBlock.style.display = 'none';

      if (data.error) {
        showError('Could not load this week\'s homework: ' + data.error);
        return;
      }

      document.getElementById('page-title').textContent = data.title || 'Homework';
      QUESTIONS = data.questions || [];
      buildQuestionsUI(QUESTIONS);
      renderMath();
      document.getElementById('submit-btn').style.display = 'block';
    })
    .catch(function (err) {
      loadingBlock.style.display = 'none';
      showError('Could not load this week\'s homework. Check your connection and try again. (' + err.message + ')');
    });
}

function collectAnswers() {
  const answers = {};
  QUESTIONS.forEach(function (q) {
    if (q.type === 'mc') {
      const checked = document.querySelector('input[name="' + q.id + '"]:checked');
      answers[q.id] = checked ? checked.value : '';
    } else {
      const el = document.getElementById('input-' + q.id);
      answers[q.id] = el ? el.value : '';
    }
  });
  return answers;
}

function showError(message) {
  const errBlock = document.getElementById('error-block');
  errBlock.textContent = message;
  errBlock.style.display = 'block';
}

function clearError() {
  document.getElementById('error-block').style.display = 'none';
}

/* ---- lightweight canvas confetti, no external dependency ---- */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#1f6f6b', '#b8860b', '#1f8a52', '#2b2f33', '#d4af37'];
  const pieces = [];
  for (let i = 0; i < 140; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: 2 + Math.random() * 3,
      speedX: -1.5 + Math.random() * 3,
      rotation: Math.random() * 360,
      spin: -6 + Math.random() * 12
    });
  }

  let frame = 0;
  const maxFrames = 150;

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.speedX;
      p.y += p.speedY;
      p.rotation += p.spin;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < maxFrames) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  tick();
}

const PASS_MESSAGES_PERFECT = [
  'Flawless! Every single question, correct.',
  'Perfect score — that\'s mastery.',
  '100%. Nothing left to prove this week.'
];
const PASS_MESSAGES_GOOD = [
  'Homework passed — nicely done!',
  'You crossed the line. Great work.',
  'Passed! That took real understanding.'
];

function pickMessage(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

let cooldownTimer = null;

function startCooldownCountdown(seconds) {
  const btn = document.getElementById('submit-btn');
  const cooldownBlock = document.getElementById('cooldown-block');
  let remaining = seconds;
  btn.disabled = true;

  if (cooldownTimer) clearInterval(cooldownTimer);

  function update() {
    cooldownBlock.style.display = 'block';
    cooldownBlock.textContent = 'Take a moment to double-check your answers — you can resubmit in ' + remaining + 's.';
    if (remaining <= 0) {
      clearInterval(cooldownTimer);
      cooldownBlock.style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Submit for checking';
    }
    remaining--;
  }
  update();
  cooldownTimer = setInterval(update, 1000);
}

document.getElementById('submit-btn').addEventListener('click', function () {
  clearError();

  const studentName = document.getElementById('student-name').value.trim();
  if (!studentName) {
    showError('Please enter your full name before submitting.');
    return;
  }

  const answers = collectAnswers();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Checking...';

  fetch(CONFIG.SCRIPT_URL, {
    method: 'POST',
    // IMPORTANT: text/plain, not application/json — this avoids the CORS
    // preflight OPTIONS request, which Apps Script Web Apps don't handle
    // by default. The body is still valid JSON — the server parses it itself.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      studentName: studentName,
      weekId: WEEK_ID,
      answers: answers
    })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.error === 'cooldown') {
        btn.textContent = 'Submit for checking';
        startCooldownCountdown(data.cooldownSecondsRemaining);
        return;
      }

      btn.disabled = false;
      btn.textContent = 'Submit for checking';

      if (data.error) {
        showError('Error: ' + data.error);
        return;
      }

      Object.keys(data.feedback).forEach(function (qId) {
        const fb = data.feedback[qId];
        const line = document.getElementById('feedback-' + qId);
        if (!line) return;
        if (fb.correct) {
          line.textContent = 'Correct';
          line.className = 'feedback-line correct';
        } else {
          line.textContent = 'Incorrect' + (fb.hint ? ' — ' + fb.hint : '');
          line.className = 'feedback-line incorrect';
          if (!fb.hint && !data.passed) {
            const lockedNote = document.createElement('span');
            lockedNote.className = 'locked-note';
            const attemptsLeft = Math.max(0, data.attemptsBeforeHints - data.attempt);
            lockedNote.textContent = attemptsLeft > 0
              ? 'Hint unlocks in ' + attemptsLeft + ' more attempt' + (attemptsLeft === 1 ? '' : 's') + ' if still below ' + data.passThreshold + '%.'
              : 'Hint should be shown — refresh and check your submission.';
            line.appendChild(lockedNote);
          }
        }
      });

      const resultBlock = document.getElementById('result-block');
      resultBlock.style.display = 'block';
      resultBlock.className = data.passed ? 'pass' : 'fail';
      document.getElementById('result-percent').textContent = data.percent + '%';
      document.getElementById('result-text').textContent =
        data.earned + ' out of ' + data.possible + ' points — ' +
        (data.passed ? pickMessage(data.percent === 100 ? PASS_MESSAGES_PERFECT : PASS_MESSAGES_GOOD)
                     : 'you need ' + data.passThreshold + '%, try again');

      const attemptNote = document.getElementById('result-attempt-note');
      if (data.passed) {
        attemptNote.textContent = 'Attempt ' + data.attempt + '.';
      } else if (data.hintsUnlocked) {
        attemptNote.textContent = 'Attempt ' + data.attempt + '. Hints for wrong answers are shown above.';
      } else {
        const attemptsLeft = Math.max(0, data.attemptsBeforeHints - data.attempt);
        attemptNote.textContent = 'Attempt ' + data.attempt + '. Hints unlock from attempt ' +
          data.attemptsBeforeHints + ' if you are still below ' + data.passThreshold + '%' +
          (attemptsLeft > 0 ? ' (' + attemptsLeft + ' more attempt' + (attemptsLeft === 1 ? '' : 's') + ' to go)' : '') + '.';
      }

      const streakBadge = document.getElementById('streak-badge');
      if (data.passed && data.streak > 1) {
        streakBadge.style.display = 'block';
        streakBadge.textContent = '🔥 ' + data.streak + '-week pass streak!';
      } else {
        streakBadge.style.display = 'none';
      }

      const solutionsBlock = document.getElementById('solutions-block');
      const solutionsContainer = document.getElementById('solutions-container');
      if (data.passed && data.solutions) {
        solutionsContainer.innerHTML = '';
        QUESTIONS.forEach(function (q) {
          const sol = data.solutions[q.id];
          if (!sol) return;
          const line = document.createElement('div');
          line.className = 'solution-line';
          const qLabel = document.createElement('div');
          qLabel.className = 'solution-q';
          qLabel.textContent = 'Question ' + q.id.replace('q', '');
          line.appendChild(qLabel);
          const solText = document.createElement('div');
          solText.textContent = sol;
          line.appendChild(solText);
          solutionsContainer.appendChild(line);
        });
        solutionsBlock.style.display = 'block';
      } else {
        solutionsBlock.style.display = 'none';
      }

      renderMath();

      if (data.passed) launchConfetti();

      resultBlock.scrollIntoView({ behavior: 'smooth' });
    })
    .catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'Submit for checking';
      showError('Could not submit. Check your connection and try again. (' + err.message + ')');
    });
});

loadWeek();
</script>

</body>
</html>
