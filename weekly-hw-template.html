<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework</title>
<style>
  :root {
    --teal: #1f6f6b;
    --teal-dark: #14504d;
    --charcoal: #2b2f33;
    --bg: #f7f8f8;
    --card: #ffffff;
    --border: #dfe3e3;
    --correct: #1f8a52;
    --incorrect: #b3392c;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--charcoal);
  }
  header {
    background: var(--charcoal);
    color: #fff;
    padding: 28px 20px;
    text-align: center;
  }
  header h1 {
    font-family: Cambria, Georgia, serif;
    margin: 0 0 6px 0;
    font-size: 1.6em;
  }
  header p { margin: 0; opacity: 0.8; font-size: 0.95em; }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px 16px;
  }

  #student-name-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  #student-name-block label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
  }
  #student-name-block input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1em;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .question-card .q-title {
    font-family: Cambria, Georgia, serif;
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 1.05em;
  }
  .question-card input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1em;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .mc-options label {
    display: block;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .mc-options input { margin-right: 8px; }

  .feedback-line {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.95em;
    display: none;
  }
  .feedback-line.correct {
    display: block;
    background: #e6f4ea;
    color: var(--correct);
  }
  .feedback-line.incorrect {
    display: block;
    background: #fbe9e7;
    color: var(--incorrect);
  }
  .feedback-line .locked-note {
    display: block;
    margin-top: 4px;
    font-size: 0.85em;
    font-style: italic;
    color: var(--muted);
  }

  #submit-btn {
    width: 100%;
    padding: 14px;
    font-size: 1.05em;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #submit-btn:hover { background: var(--teal-dark); }
  #submit-btn:disabled { opacity: 0.6; cursor: default; }

  #result-block {
    display: none;
    margin-top: 24px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    color: #fff;
  }
  #result-block.pass { background: var(--correct); }
  #result-block.fail { background: var(--incorrect); }
  #result-block .big-percent {
    font-family: Cambria, Georgia, serif;
    font-size: 2.4em;
    font-weight: bold;
  }
  #result-block .attempt-note {
    margin-top: 8px;
    font-size: 0.9em;
    opacity: 0.9;
  }

  #error-block {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    background: #fbe9e7;
    color: var(--incorrect);
    border-radius: 8px;
  }
</style>
</head>
<body>

<header>
  <h1 id="page-title">Homework</h1>
  <p id="page-subtitle">Fill in your answers and press "Submit" — you'll get your result right away</p>
</header>

<main>
  <div id="student-name-block">
    <label for="student-name">Full name</label>
    <input type="text" id="student-name" placeholder="e.g. Alex Morgan">
  </div>

  <div id="questions-container"></div>

  <button id="submit-btn">Submit for checking</button>

  <div id="error-block"></div>

  <div id="result-block">
    <div class="big-percent" id="result-percent"></div>
    <div id="result-text"></div>
    <div class="attempt-note" id="result-attempt-note"></div>
  </div>
</main>

<script>
/* =========================================================================
   THIS WEEK'S SETTINGS — usually the only thing you need to change each week.
   Correct answers are NOT written here — they live only on the server, in
   the AnswerKey sheet, and are checked there.
   ========================================================================= */

const CONFIG = {
  // Apps Script web app URL (Deploy → New deployment → Web app)
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbz7CnzOs39aO8jTRa7C7Zdp3thOrDvQEDNV88QE0bV4obvLcWDFYp6AuIFd4sqd4Rs/exec",

  // Must match the WeekID in the AnswerKey sheet for this week
  WEEK_ID: "week-01",

  PAGE_TITLE: "HW — Week 1: Quadratics, Calculus & Simultaneous Equations",
  PAGE_SUBTITLE: "Fill in your answers and press “Submit” — you'll get your result right away"
};

// This week's questions. type: "numeric" | "text" | "mc"
// For "mc", give `choices` — the options the student will see.
// id must match the QuestionID in the AnswerKey sheet.
const QUESTIONS = [
  {
    id: "q1",
    type: "numeric",
    title: "1) Solve 2x² − 3x − 5 = 0. Give the positive root as a decimal."
  },
  {
    id: "q2",
    type: "text",
    title: "2) Differentiate y = 3x² − 4x + 7 with respect to x. Give dy/dx in the form ax + b."
  },
  {
    id: "q3",
    type: "mc",
    title: "3) Which expression is equivalent to (2x³)²?",
    choices: [
      { value: "a", label: "a) 4x⁵" },
      { value: "b", label: "b) 4x⁶" },
      { value: "c", label: "c) 2x⁶" }
    ]
  },
  {
    id: "q4",
    type: "numeric",
    title: "4) Solve simultaneously: 2x + y = 11 and x − y = 1. Find x."
  }
];

/* ========================================================================= */

document.getElementById('page-title').textContent = CONFIG.PAGE_TITLE;
document.getElementById('page-subtitle').textContent = CONFIG.PAGE_SUBTITLE;

const container = document.getElementById('questions-container');

QUESTIONS.forEach(function (q) {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = 'card-' + q.id;

  const title = document.createElement('div');
  title.className = 'q-title';
  title.textContent = q.title;
  card.appendChild(title);

  if (q.type === 'mc') {
    const optionsWrap = document.createElement('div');
    optionsWrap.className = 'mc-options';
    q.choices.forEach(function (choice) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = q.id;
      input.value = choice.value;
      label.appendChild(input);
      label.appendChild(document.createTextNode(choice.label));
      optionsWrap.appendChild(label);
    });
    card.appendChild(optionsWrap);
  } else {
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'input-' + q.id;
    input.placeholder = q.type === 'numeric' ? 'Enter a number' : 'Enter your answer';
    card.appendChild(input);
  }

  const feedbackLine = document.createElement('div');
  feedbackLine.className = 'feedback-line';
  feedbackLine.id = 'feedback-' + q.id;
  card.appendChild(feedbackLine);

  container.appendChild(card);
});

function collectAnswers() {
  const answers = {};
  QUESTIONS.forEach(function (q) {
    if (q.type === 'mc') {
      const checked = document.querySelector('input[name="' + q.id + '"]:checked');
      answers[q.id] = checked ? checked.value : '';
    } else {
      const el = document.getElementById('input-' + q.id);
      answers[q.id] = el ? el.value : '';
    }
  });
  return answers;
}

function showError(message) {
  const errBlock = document.getElementById('error-block');
  errBlock.textContent = message;
  errBlock.style.display = 'block';
}

function clearError() {
  document.getElementById('error-block').style.display = 'none';
}

document.getElementById('submit-btn').addEventListener('click', function () {
  clearError();

  const studentName = document.getElementById('student-name').value.trim();
  if (!studentName) {
    showError('Please enter your full name before submitting.');
    return;
  }

  const answers = collectAnswers();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Checking...';

  fetch(CONFIG.SCRIPT_URL, {
    method: 'POST',
    // IMPORTANT: text/plain, not application/json — this avoids the CORS
    // preflight OPTIONS request, which Apps Script Web Apps don't handle
    // by default. The body is still valid JSON — the server parses it itself.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      studentName: studentName,
      weekId: CONFIG.WEEK_ID,
      answers: answers
    })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      btn.disabled = false;
      btn.textContent = 'Submit for checking';

      if (data.error) {
        showError('Error: ' + data.error);
        return;
      }

      Object.keys(data.feedback).forEach(function (qId) {
        const fb = data.feedback[qId];
        const line = document.getElementById('feedback-' + qId);
        if (!line) return;
        if (fb.correct) {
          line.textContent = 'Correct';
          line.className = 'feedback-line correct';
        } else {
          line.textContent = 'Incorrect' + (fb.hint ? ' — ' + fb.hint : '');
          line.className = 'feedback-line incorrect';
          if (!fb.hint && !data.passed) {
            const lockedNote = document.createElement('span');
            lockedNote.className = 'locked-note';
            const attemptsLeft = Math.max(0, data.attemptsBeforeHints - data.attempt);
            lockedNote.textContent = attemptsLeft > 0
              ? 'Hint unlocks in ' + attemptsLeft + ' more attempt' + (attemptsLeft === 1 ? '' : 's') + ' if still below ' + data.passThreshold + '%.'
              : 'Hint should be shown — refresh and check your submission.';
            line.appendChild(lockedNote);
          }
        }
      });

      const resultBlock = document.getElementById('result-block');
      resultBlock.style.display = 'block';
      resultBlock.className = data.passed ? 'pass' : 'fail';
      document.getElementById('result-percent').textContent = data.percent + '%';
      document.getElementById('result-text').textContent =
        data.earned + ' out of ' + data.possible + ' points' +
        (data.passed ? ' — homework passed!' : ' — you need ' + data.passThreshold + '%, try again');

      const attemptNote = document.getElementById('result-attempt-note');
      if (data.passed) {
        attemptNote.textContent = 'Attempt ' + data.attempt + '.';
      } else if (data.hintsUnlocked) {
        attemptNote.textContent = 'Attempt ' + data.attempt + '. Hints for wrong answers are shown above.';
      } else {
        const attemptsLeft = Math.max(0, data.attemptsBeforeHints - data.attempt);
        attemptNote.textContent = 'Attempt ' + data.attempt + '. Hints unlock from attempt ' +
          data.attemptsBeforeHints + ' if you are still below ' + data.passThreshold + '%' +
          (attemptsLeft > 0 ? ' (' + attemptsLeft + ' more attempt' + (attemptsLeft === 1 ? '' : 's') + ' to go)' : '') + '.';
      }

      resultBlock.scrollIntoView({ behavior: 'smooth' });
    })
    .catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'Submit for checking';
      showError('Could not submit. Check your connection and try again. (' + err.message + ')');
    });
});
</script>

</body>
</html>
